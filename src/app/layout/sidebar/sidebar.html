<aside class="sidebar" aria-label="Navegação principal">
  <div class="sidebar__brand">
    <div class="sidebar__logo" aria-hidden="true">
      F
    </div>

    <div class="sidebar__brand-text">
      <span class="sidebar__brand-name">FlowDesk</span>
      <span class="sidebar__brand-description">Workspace</span>
    </div>
  </div>

  <nav class="sidebar__navigation">
    <span class="sidebar__section-title">Menu</span>

    <ul class="sidebar__menu">
      <li class="sidebar__menu-item">
            <a
                class="sidebar__menu-button"
                routerLink="/dashboard"
                routerLinkActive="sidebar__menu-button--active"
                ariaCurrentWhenActive="page"
            >
                <svg
                  lucideLayoutDashboard
                  class="sidebar__menu-icon"
                  [size]="20"
                  [strokeWidth]="1.8"
                  aria-hidden="true"
                ></svg>
                <span>Dashboard</span>
            </a>
        </li>

        <li class="sidebar__menu-item">
            <a
                class="sidebar__menu-button"
                routerLink="/projects"
                routerLinkActive="sidebar__menu-button--active"
                ariaCurrentWhenActive="page"
            >
                <svg
                  lucideFolderKanban
                  class="sidebar__menu-icon"
                  [size]="20"
                  [strokeWidth]="1.8"
                  aria-hidden="true"
                ></svg>
                <span>Projetos</span>
            </a>
        </li>

      <li class="sidebar__menu-item">
        <a class="sidebar__menu-button"
          routerLink="/clients"
          routerLinkActive="sidebar__menu-button--active"
          ariaCurrentWhenActive="page"
        >
          <svg
            lucideUsers
            class="sidebar__menu-icon"
            [size]="20"
            [strokeWidth]="1.8"
            aria-hidden="true"
          ></svg>
          <span>Clientes</span>
        </a>
      </li>

      <li class="sidebar__menu-item">
        <a
          class="sidebar__menu-button"
          routerLink="/tasks"
          routerLinkActive="sidebar__menu-button--active"
          ariaCurrentWhenActive="page"
        >
          <svg
            lucideListTodo
            class="sidebar__menu-icon"
            [size]="20"
            [strokeWidth]="1.8"
            aria-hidden="true"
          ></svg>
          <span>Tarefas</span>
        </a>
      </li>

      <li class="sidebar__menu-item">
        <a
          class="sidebar__menu-button"
          routerLink="/team"
          routerLinkActive="sidebar__menu-button--active"
          ariaCurrentWhenActive="page"
        >
          <svg
            lucideUserRound
            class="sidebar__menu-icon"
            [size]="20"
            [strokeWidth]="1.8"
            aria-hidden="true"
          ></svg>
          <span>Equipe</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar__footer">
    <span class="sidebar__section-title">Sistema</span>

    <a
      class="sidebar__menu-button"
      routerLink="/settings"
      routerLinkActive="sidebar__menu-button--active"
      ariaCurrentWhenActive="page"
    >
      <svg
        lucideSettings
        class="sidebar__menu-icon"
        [size]="20"
        [strokeWidth]="1.8"
        aria-hidden="true"
      ></svg>
      <span>Configurações</span>
    </a>
  </div>
</aside>
