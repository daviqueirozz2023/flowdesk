<header class="header">
  <div class="header__content">
    <div class="header__page-info">
        <span class="header__eyebrow">{{ pageEyebrow() }}</span>
        <h1 class="header__title">{{ pageTitle() }}</h1>
    </div>

    <div class="header__actions">
      <label class="header__search">
        <span class="header__search-icon" aria-hidden="true">⌕</span>

        <input
          class="header__search-input"
          type="search"
          placeholder="Buscar..."
          aria-label="Buscar no FlowDesk"
        />
      </label>

      <button
        class="header__icon-button"
        type="button"
        aria-label="Notificações"
        title="Notificações"
      >
        <svg
            lucideBell
            [size]="18"
            [strokeWidth]="1.8"
            aria-hidden="true"
        ></svg>
      </button>

      <button
        class="header__profile"
        type="button"
        aria-label="Abrir menu do usuário"
      >
        <span class="header__avatar" aria-hidden="true">DA</span>

        <span class="header__profile-info">
          <strong class="header__profile-name">Davi Amaral</strong>
          <span class="header__profile-role">Administrador</span>
        </span>

        <span
          class="header__profile-chevron"
          aria-hidden="true"
        >
          ▾
        </span>
      </button>
    </div>
  </div>
</header>
